[project]
name = "macfleet"
version = "0.5.1"
description = "Spin up and control a fleet of macOS VMs via tart + cua"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Fridzema" }]
keywords = ["macos", "vm", "tart", "virtualization", "computer-use", "mcp"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Emulators",
    "Topic :: System :: Systems Administration",
]
dependencies = ["typer>=0.12", "fastapi>=0.111", "uvicorn>=0.30"]

[project.optional-dependencies]
# Computer-use drives the in-guest cua-computer-server over HTTP (stdlib only), so it
# needs no client library — just the MACFLEET_ALLOW_CONTROL=1 runtime gate.
agent = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.16", "httpx>=0.27", "pyinstaller==6.22.2"]
mcp = ["mcp>=2.0"]

[project.urls]
Homepage = "https://github.com/fridzema/macfleet"
Repository = "https://github.com/fridzema/macfleet"
Issues = "https://github.com/fridzema/macfleet/issues"
Changelog = "https://github.com/fridzema/macfleet/blob/main/CHANGELOG.md"

[project.scripts]
macfleet = "macfleet.cli:app"
macfleet-mcp = "macfleet.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/macfleet",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["macfleet"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly. Ruff's implicit defaults widen between releases, so leaving this
# unset means a routine version bump silently changes what "lint" means and breaks CI on
# an unrelated pull request. E4/E7/E9 + F is ruff's long-standing default; I sorts
# imports and UP keeps syntax at the target version, both fully autofixable.
# Deliberately absent: BLE001 and SIM115 would flag the documented best-effort
# `except Exception` paths and the restore-probe temp file that must outlive its function.
select = ["E4", "E7", "E9", "F", "I", "UP"]
