name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra mcp
      - run: uv run ruff check .
      - run: uv run --extra mcp pytest -q
      - run: uv export --format requirements-txt --no-dev --extra mcp --no-emit-project --output-file requirements-audit.txt
      # uv already exported the complete, pinned transitive graph. Avoid asking
      # pip-audit to create a second environment and resolve it again.
      - run: uvx pip-audit --disable-pip --no-deps -r requirements-audit.txt
      - run: uv export --format requirements-txt --extra dev --no-emit-project --output-file build-requirements-audit.txt
      - run: uvx pip-audit --disable-pip --no-deps -r build-requirements-audit.txt

  desktop:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desktop/.bun-version
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bunx playwright install chromium firefox webkit
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:unit:coverage
      - run: bun run test:e2e
      - run: bun run build
      - run: bun run build:engine
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --locked
      # quick-xml 0.39 is only pulled by Linux's wayland-scanner build tool, which parses
      # trusted protocol XML at compile time; no newer compatible scanner exists yet.
      # rkyv 0.7 is an optional rust_decimal feature recorded in Cargo.lock through
      # tauri-plugin-log -> byte-unit. It is absent from `cargo tree --target all`, so no
      # vulnerable rkyv code is compiled into macfleet; rust_decimal has no compatible
      # release on rkyv 0.8 yet.
      - run: >-
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2026-0235
