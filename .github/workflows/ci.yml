name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra mcp
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --extra mcp pytest -q
      - run: uv export --format requirements-txt --no-dev --extra mcp --no-emit-project --output-file requirements-audit.txt
        if: matrix.python-version == '3.14'
      # uv already exported the complete, pinned transitive graph. Avoid asking
      # pip-audit to create a second environment and resolve it again.
      - run: uvx pip-audit --disable-pip --no-deps -r requirements-audit.txt
        if: matrix.python-version == '3.14'
      - run: uv export --format requirements-txt --extra dev --no-emit-project --output-file build-requirements-audit.txt
        if: matrix.python-version == '3.14'
      - run: uvx pip-audit --disable-pip --no-deps -r build-requirements-audit.txt
        if: matrix.python-version == '3.14'

  desktop:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desktop/.bun-version
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bunx playwright install chromium firefox webkit
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:unit:coverage
      - run: bun run test:e2e
      - run: bun run build
      - run: bun run build:engine
      - run: uv run --project .. python ../scripts/verify-packaged-engine.py src-tauri/binaries/macfleet-engine/macfleet-engine
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --locked
      # Risk exceptions and their justification live in src-tauri/.cargo/audit.toml.
      - run: cargo audit
        working-directory: desktop/src-tauri
